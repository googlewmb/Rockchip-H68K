name: Validate build automation

on:
  push:
    paths: ['.github/workflows/**', 'scripts/**', '**/diy-*.sh']
  pull_request:
    paths: ['.github/workflows/**', 'scripts/**', '**/diy-*.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test build helpers
        run: python3 scripts/test-ci.py
      - name: Check shell syntax
        run: find scripts istore test-istore Openwrt test-openwrt -name '*.sh' -print0 | xargs -0 -n1 bash -n
