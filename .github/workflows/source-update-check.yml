name: 源码更新检测

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "58 18 * * *" # 每天北京时间 02:58

jobs:
  source-check:
    name: 检测源码更新
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@main
        with:
          ref: main
          fetch-depth: 1

      # ==========================================================
      # 自动检测源码
      # ==========================================================

      - name: 检测所有源码
        id: check
        shell: bash
        run: |
          set -e

          mkdir -p .github/source-state

          echo "============================================================"
          echo "开始检测源码更新"
          echo "============================================================"

          check_source() {
            local name="$1"
            local repo="$2"
            local branch="$3"
            local state="$4"
            local output="$5"

            echo ""
            echo "------------------------------------------------------------"
            echo "源码：$name"
            echo "仓库：$repo"
            echo "分支：$branch"
            echo "------------------------------------------------------------"

            local new
            local old=""

            new=$(git ls-remote \
              "https://github.com/${repo}.git" \
              "refs/heads/${branch}" | awk '{print $1}')

            if [ -z "$new" ]; then
              echo "❌ 无法获取 ${repo} ${branch} 最新 Commit"
              return 1
            fi

            if [ -f "$state" ]; then
              old=$(cat "$state")
            fi

            echo "旧 Commit：${old:-无}"
            echo "新 Commit：$new"

            if [ -z "$old" ]; then
              echo "首次检测：记录当前 Commit"
              echo "$new" > "$state"

            elif [ "$new" != "$old" ]; then
              echo "✅ 检测到源码更新"
              echo "$new" > "$state"

              echo "$output=true" >> "$GITHUB_OUTPUT"

            else
              echo "源码没有更新"
            fi
          }

          # ========================================================
          # OpenWrt main
          # ========================================================

          check_source \
            "OpenWrt main" \
            "openwrt/openwrt" \
            "main" \
            ".github/source-state/openwrt-main" \
            "openwrt_main_updated"

          # ========================================================
          # iStoreOS 24.10
          # ========================================================

          check_source \
            "iStoreOS 24.10" \
            "istoreos/istoreos" \
            "istoreos-24.10" \
            ".github/source-state/istoreos-24.10" \
            "istore_24_updated"

          # ========================================================
          # iStoreOS 25.12
          # ========================================================

          check_source \
            "iStoreOS 25.12" \
            "istoreos/istoreos" \
            "istoreos-25.12" \
            ".github/source-state/istoreos-25.12" \
            "istore_25_updated"

          # ========================================================
          # LEDE
          # ========================================================

          check_source \
            "LEDE" \
            "coolsnowwolf/lede" \
            "master" \
            ".github/source-state/lede" \
            "lede_updated"

          echo ""
          echo "============================================================"
          echo "源码检测完成"
          echo "============================================================"

      # ==========================================================
      # 保存 Commit 状态
      # ==========================================================

      - name: 保存源码 Commit 状态
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/source-state; then
            echo "源码状态没有变化，无需提交"
            exit 0
          fi

          echo "检测到源码状态变化"

          git add .github/source-state

          git commit -m "chore: update source commit state"

          git push origin HEAD:main

      # ==========================================================
      # 自动扫描并触发对应编译 Workflow
      # ==========================================================

      - name: 自动扫描并触发编译
        if: |
          steps.check.outputs.openwrt_main_updated == 'true' ||
          steps.check.outputs.istore_24_updated == 'true' ||
          steps.check.outputs.istore_25_updated == 'true' ||
          steps.check.outputs.lede_updated == 'true'
        uses: actions/github-script@main
        env:
          OPENWRT_MAIN_UPDATED: ${{ steps.check.outputs.openwrt_main_updated }}
          ISTORE_24_UPDATED: ${{ steps.check.outputs.istore_24_updated }}
          ISTORE_25_UPDATED: ${{ steps.check.outputs.istore_25_updated }}
          LEDE_UPDATED: ${{ steps.check.outputs.lede_updated }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ========================================================
            // 当前源码更新状态
            // ========================================================

            const updated = {
              "openwrt/openwrt@main":
                process.env.OPENWRT_MAIN_UPDATED === "true",

              "istoreos/istoreos@istoreos-24.10":
                process.env.ISTORE_24_UPDATED === "true",

              "istoreos/istoreos@istoreos-25.12":
                process.env.ISTORE_25_UPDATED === "true",

              "coolsnowwolf/lede@master":
                process.env.LEDE_UPDATED === "true"
            };

            console.log("");
            console.log("============================================================");
            console.log("源码更新状态");
            console.log("============================================================");

            for (const [source, changed] of Object.entries(updated)) {
              console.log(`${source} -> ${changed ? "UPDATED" : "NO UPDATE"}`);
            }

            // ========================================================
            // 扫描 Workflow 文件
            // ========================================================

            const workflowsDir = ".github/workflows";

            if (!fs.existsSync(workflowsDir)) {
              console.log("❌ .github/workflows 不存在");
              return;
            }

            const workflowFiles = fs.readdirSync(workflowsDir)
              .filter(file =>
                file.endsWith(".yml") ||
                file.endsWith(".yaml")
              )
              .filter(file =>
                file !== "source-update-check.yml"
              );

            console.log("");
            console.log("============================================================");
            console.log("自动扫描 Workflow");
            console.log("============================================================");

            console.log(`发现 ${workflowFiles.length} 个 Workflow`);

            // ========================================================
            // 简单读取 YAML 中的变量
            //
            // 这里主要读取：
            //
            // REPO_URL
            // REPO_BRANCH
            //
            // 例如：
            //
            // env:
            //   REPO_URL: https://github.com/openwrt/openwrt
            //   REPO_BRANCH: main
            //
            // 或：
            //
            // REPO_URL: https://github.com/istoreos/istoreos
            // REPO_BRANCH: istoreos-24.10
            // ========================================================

            function getYamlValue(content, key) {
              const regex = new RegExp(
                "^\\s*" + key + "\\s*:\\s*[\"']?([^\"'\\n#]+?)[\"']?\\s*(?:#.*)?$",
                "m"
              );

              const match = content.match(regex);

              if (!match) {
                return "";
              }

              return match[1].trim();
            }

            function normalizeRepo(url) {
              if (!url) {
                return "";
              }

              let value = url.trim();

              value = value.replace(/^["']|["']$/g, "");

              value = value.replace(/^https?:\\/\\//, "");

              value = value.replace(/^www\\.github\\.com\\//, "");

              value = value.replace(/^github\\.com\\//, "");

              value = value.replace(/\\.git$/, "");

              value = value.replace(/\\/$/, "");

              return value;
            }

            // ========================================================
            // 判断 Workflow 是否支持 workflow_dispatch
            // ========================================================

            function hasWorkflowDispatch(content) {
              return (
                /(^|\\n)\\s*workflow_dispatch\\s*:/m.test(content) ||
                /(^|\\n)\\s*workflow_dispatch\\s*$/m.test(content)
              );
            }

            // ========================================================
            // 扫描
            // ========================================================

            const matched = [];

            for (const file of workflowFiles) {
              const fullPath = path.join(workflowsDir, file);

              const content = fs.readFileSync(fullPath, "utf8");

              const repoUrl = getYamlValue(content, "REPO_URL");
              const branch = getYamlValue(content, "REPO_BRANCH");

              const repoName = normalizeRepo(repoUrl);

              // 没有源码仓库信息，不属于自动源码触发型 Workflow
              if (!repoName || !branch) {
                console.log("");
                console.log(`跳过：${file}`);
                console.log("原因：没有找到 REPO_URL / REPO_BRANCH");
                continue;
              }

              const sourceKey = `${repoName}@${branch}`;

              console.log("");
              console.log(`Workflow：${file}`);
              console.log(`REPO_URL：${repoName}`);
              console.log(`REPO_BRANCH：${branch}`);
              console.log(`Source：${sourceKey}`);

              // ======================================================
              // 判断是否属于本次发生更新的源码
              // ======================================================

              if (!updated[sourceKey]) {
                console.log("状态：源码没有更新");
                continue;
              }

              // ======================================================
              // 判断是否支持 workflow_dispatch
              // ======================================================

              if (!hasWorkflowDispatch(content)) {
                console.log("⚠️ 跳过：不支持 workflow_dispatch");
                continue;
              }

              matched.push({
                file,
                sourceKey
              });

              console.log("✅ 匹配成功");
            }

            // ========================================================
            // 输出匹配结果
            // ========================================================

            console.log("");
            console.log("============================================================");
            console.log("自动匹配结果");
            console.log("============================================================");

            if (matched.length === 0) {
              console.log("没有需要触发的编译 Workflow");
              return;
            }

            for (const item of matched) {
              console.log(
                `匹配：${item.file} <- ${item.sourceKey}`
              );
            }

            // ========================================================
            // 触发 Workflow
            // ========================================================

            console.log("");
            console.log("============================================================");
            console.log("开始触发编译 Workflow");
            console.log("============================================================");

            for (const item of matched) {
              console.log(`🚀 触发：${item.file}`);

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: item.file,
                  ref: "main"
                });

                console.log(`✅ 已触发：${item.file}`);

              } catch (error) {
                console.log(
                  `❌ 触发失败：${item.file}`
                );

                console.log(error.message);

                throw error;
              }
            }

            console.log("");
            console.log("============================================================");
            console.log("全部匹配 Workflow 触发完成");
            console.log("============================================================");
