name: 源码更新检测

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "58 6,18 * * *"

concurrency:
  group: source-update-check
  cancel-in-progress: false

jobs:
  source-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 检测源码并触发更新的工作流
        run: python3 scripts/check-sources.py
      - name: 保存成功触发的版本
        if: ${{ always() && hashFiles('.github/source-state/dispatched.json') != '' }}
        run: python3 scripts/ci-save-file.py .github/source-state/dispatched.json .github/source-state/dispatched.json "$DEFAULT_BRANCH"
