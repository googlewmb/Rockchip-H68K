name: 源码更新检测

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 每天中国时间凌晨 02:00

jobs:
  source-check:
    name: 自动检测所有源码
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@main
        with:
          ref: main
          fetch-depth: 1

      - name: 扫描所有 Workflow
        id: scan
        shell: bash
        run: |
          set -e

          mkdir -p .github/source-state

          echo "============================================================"
          echo "自动扫描 .github/workflows"
          echo "============================================================"

          python3 <<'PY'
          import os
          import re
          import json

          workflows_dir = ".github/workflows"

          if not os.path.isdir(workflows_dir):
              print("❌ .github/workflows 不存在")
              raise SystemExit(1)

          workflows = []

          for filename in sorted(os.listdir(workflows_dir)):

              if not (
                  filename.endswith(".yml")
                  or filename.endswith(".yaml")
              ):
                  continue

              if filename == "source-update-check.yml":
                  continue

              path = os.path.join(workflows_dir, filename)

              if not os.path.isfile(path):
                  continue

              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              repo_match = re.search(
                  r'^\s*REPO_URL\s*:\s*["\']?([^"\'\n#]+)["\']?\s*(?:#.*)?$',
                  content,
                  re.MULTILINE
              )

              branch_match = re.search(
                  r'^\s*REPO_BRANCH\s*:\s*["\']?([^"\'\n#]+)["\']?\s*(?:#.*)?$',
                  content,
                  re.MULTILINE
              )

              dispatch_match = re.search(
                  r'^\s*workflow_dispatch\s*:',
                  content,
                  re.MULTILINE
              )

              if not repo_match or not branch_match:
                  print(f"跳过 {filename}")
                  print("  原因：没有 REPO_URL / REPO_BRANCH")
                  continue

              repo_url = repo_match.group(1).strip()
              branch = branch_match.group(1).strip()

              repo_url = re.sub(
                  r'^https?://github\.com/',
                  '',
                  repo_url
              )

              repo_url = re.sub(
                  r'^github\.com/',
                  '',
                  repo_url
              )

              repo_url = repo_url.rstrip("/")

              repo_url = re.sub(
                  r'\.git$',
                  '',
                  repo_url
              )

              source_key = f"{repo_url}@{branch}"

              workflows.append({
                  "file": filename,
                  "repo": repo_url,
                  "branch": branch,
                  "source_key": source_key,
                  "dispatch": bool(dispatch_match)
              })

              print("")
              print(f"发现 Workflow：{filename}")
              print(f"  源码：{repo_url}")
              print(f"  分支：{branch}")
              print(f"  Key：{source_key}")
              print(
                  f"  workflow_dispatch："
                  f"{'是' if dispatch_match else '否'}"
              )

          sources = {}

          for item in workflows:

              key = item["source_key"]

              if key not in sources:
                  sources[key] = {
                      "repo": item["repo"],
                      "branch": item["branch"]
                  }

          os.makedirs(".github/source-state", exist_ok=True)

          with open(
              ".github/source-state/workflows.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  workflows,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              ".github/source-state/sources.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  sources,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("============================================================")
          print(f"发现 Workflow：{len(workflows)}")
          print(f"发现独立源码：{len(sources)}")
          print("============================================================")
          PY

      - name: 检测所有源码更新
        id: check
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "开始检测源码"
          echo "============================================================"

          python3 <<'PY'
          import os
          import json
          import subprocess

          SOURCES_FILE = ".github/source-state/sources.json"
          STATE_DIR = ".github/source-state"

          with open(SOURCES_FILE, "r", encoding="utf-8") as f:
              sources = json.load(f)

          updated = []

          github_output = os.environ.get("GITHUB_OUTPUT")

          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write("has_updates=false\n")

          for source_key, source in sources.items():

              repo = source["repo"]
              branch = source["branch"]

              safe_name = (
                  source_key
                  .replace("/", "__")
                  .replace("@", "__")
                  .replace(":", "__")
              )

              state_file = os.path.join(
                  STATE_DIR,
                  safe_name
              )

              print("")
              print("------------------------------------------------------------")
              print(f"源码：{source_key}")
              print(f"仓库：{repo}")
              print(f"分支：{branch}")
              print("------------------------------------------------------------")

              url = f"https://github.com/{repo}.git"

              result = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      url,
                      f"refs/heads/{branch}"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print("❌ git ls-remote 失败")
                  print(result.stderr)
                  continue

              new_commit = ""

              for line in result.stdout.splitlines():

                  parts = line.split()

                  if len(parts) >= 1:
                      new_commit = parts[0]
                      break

              if not new_commit:
                  print("❌ 无法获取最新 Commit")
                  continue

              old_commit = ""

              if os.path.isfile(state_file):

                  with open(
                      state_file,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      old_commit = f.read().strip()

              print(
                  f"旧 Commit："
                  f"{old_commit if old_commit else '无'}"
              )

              print(f"新 Commit：{new_commit}")

              if not old_commit:

                  print("首次检测")

                  with open(
                      state_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(new_commit)

                  updated.append(source_key)

                  print("已记录当前 Commit")
                  print("首次检测触发编译")

                  continue

              if old_commit != new_commit:

                  print("✅ 检测到源码更新")

                  with open(
                      state_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(new_commit)

                  updated.append(source_key)

                  print("已更新状态")

              else:

                  print("源码没有更新")

          with open(
              ".github/source-state/updated.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  updated,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("============================================================")
          print("源码检测完成")
          print(f"发生更新的源码：{len(updated)}")
          print("============================================================")

          for item in updated:
              print(f"  UPDATED: {item}")

          if github_output and updated:
              with open(
                  github_output,
                  "a",
                  encoding="utf-8"
              ) as out:
                  out.write("has_updates=true\n")
          PY

      - name: 提交状态变化
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/source-state

          if git diff --cached --quiet; then
              echo "没有状态变化"
              exit 0
          fi

          git commit -m "chore: update source state"
          git push

      - name: 触发源码更新对应 Workflow
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@main
        with:
          script: |
            const fs = require('fs');

            const workflows = JSON.parse(
              fs.readFileSync(
                '.github/source-state/workflows.json',
                'utf8'
              )
            );

            const updated = JSON.parse(
              fs.readFileSync(
                '.github/source-state/updated.json',
                'utf8'
              )
            );

            console.log('检测到更新源码：');

            for (const sourceKey of updated) {

              console.log(`\n源码：${sourceKey}`);

              const matched = workflows.filter(
                w => w.source_key === sourceKey
              );

              for (const workflow of matched) {

                if (!workflow.dispatch) {
                  console.log(
                    `跳过 ${workflow.file}：没有 workflow_dispatch`
                  );
                  continue;
                }

                console.log(
                  `触发 Workflow：${workflow.file}`
                );

                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.file,
                  ref: 'main'
                });
              }
            }
