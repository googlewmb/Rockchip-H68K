name: 源码更新检测

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "58 18 * * *" # 每天北京时间 02:58

jobs:
  source-check:
    name: 检测源码更新
    runs-on: ubuntu-latest

    outputs:
      openwrt_main_updated: ${{ steps.check.outputs.openwrt_main_updated }}
      istore_24_updated: ${{ steps.check.outputs.istore_24_updated }}
      istore_25_updated: ${{ steps.check.outputs.istore_25_updated }}
      lede_updated: ${{ steps.check.outputs.lede_updated }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 检测所有源码
        id: check
        shell: bash
        run: |
          set -e

          mkdir -p .github/source-state

          # 默认全部没有更新
          echo "openwrt_main_updated=false" >> "$GITHUB_OUTPUT"
          echo "istore_24_updated=false" >> "$GITHUB_OUTPUT"
          echo "istore_25_updated=false" >> "$GITHUB_OUTPUT"
          echo "lede_updated=false" >> "$GITHUB_OUTPUT"

          # ==========================================================
          # OpenWrt main
          # ==========================================================

          echo ""
          echo "============================================================"
          echo "检测 OpenWrt main"
          echo "============================================================"

          REPO="openwrt/openwrt"
          BRANCH="main"
          STATE=".github/source-state/openwrt-main"

          NEW=$(git ls-remote \
            "https://github.com/${REPO}.git" \
            "refs/heads/${BRANCH}" | awk '{print $1}')

          if [ -z "$NEW" ]; then
            echo "无法获取 OpenWrt main 最新 Commit"
            exit 1
          fi

          OLD=""

          if [ -f "$STATE" ]; then
            OLD=$(cat "$STATE")
          fi

          echo "旧 Commit: ${OLD:-无}"
          echo "新 Commit: $NEW"

          if [ -z "$OLD" ]; then
            echo "首次检测 OpenWrt main"
            echo "$NEW" > "$STATE"
          elif [ "$NEW" != "$OLD" ]; then
            echo "检测到 OpenWrt main 更新"
            echo "$NEW" > "$STATE"
            echo "openwrt_main_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "OpenWrt main 没有更新"
          fi

          # ==========================================================
          # iStoreOS 24.10
          # ==========================================================

          echo ""
          echo "============================================================"
          echo "检测 iStoreOS 24.10"
          echo "============================================================"

          REPO="istoreos/istoreos"
          BRANCH="istoreos-24.10"
          STATE=".github/source-state/istoreos-24.10"

          NEW=$(git ls-remote \
            "https://github.com/${REPO}.git" \
            "refs/heads/${BRANCH}" | awk '{print $1}')

          if [ -z "$NEW" ]; then
            echo "无法获取 iStoreOS 24.10 最新 Commit"
            exit 1
          fi

          OLD=""

          if [ -f "$STATE" ]; then
            OLD=$(cat "$STATE")
          fi

          echo "旧 Commit: ${OLD:-无}"
          echo "新 Commit: $NEW"

          if [ -z "$OLD" ]; then
            echo "首次检测 iStoreOS 24.10"
            echo "$NEW" > "$STATE"
          elif [ "$NEW" != "$OLD" ]; then
            echo "检测到 iStoreOS 24.10 更新"
            echo "$NEW" > "$STATE"
            echo "istore_24_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "iStoreOS 24.10 没有更新"
          fi

          # ==========================================================
          # iStoreOS 25.12
          # ==========================================================

          echo ""
          echo "============================================================"
          echo "检测 iStoreOS 25.12"
          echo "============================================================"

          REPO="istoreos/istoreos"
          BRANCH="istoreos-25.12"
          STATE=".github/source-state/istoreos-25.12"

          NEW=$(git ls-remote \
            "https://github.com/${REPO}.git" \
            "refs/heads/${BRANCH}" | awk '{print $1}')

          if [ -z "$NEW" ]; then
            echo "无法获取 iStoreOS 25.12 最新 Commit"
            exit 1
          fi

          OLD=""

          if [ -f "$STATE" ]; then
            OLD=$(cat "$STATE")
          fi

          echo "旧 Commit: ${OLD:-无}"
          echo "新 Commit: $NEW"

          if [ -z "$OLD" ]; then
            echo "首次检测 iStoreOS 25.12"
            echo "$NEW" > "$STATE"
          elif [ "$NEW" != "$OLD" ]; then
            echo "检测到 iStoreOS 25.12 更新"
            echo "$NEW" > "$STATE"
            echo "istore_25_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "iStoreOS 25.12 没有更新"
          fi

          # ==========================================================
          # LEDE
          # ==========================================================

          echo ""
          echo "============================================================"
          echo "检测 LEDE"
          echo "============================================================"

          REPO="coolsnowwolf/lede"
          BRANCH="master"
          STATE=".github/source-state/lede"

          NEW=$(git ls-remote \
            "https://github.com/${REPO}.git" \
            "refs/heads/${BRANCH}" | awk '{print $1}')

          if [ -z "$NEW" ]; then
            echo "无法获取 LEDE 最新 Commit"
            exit 1
          fi

          OLD=""

          if [ -f "$STATE" ]; then
            OLD=$(cat "$STATE")
          fi

          echo "旧 Commit: ${OLD:-无}"
          echo "新 Commit: $NEW"

          if [ -z "$OLD" ]; then
            echo "首次检测 LEDE"
            echo "$NEW" > "$STATE"
          elif [ "$NEW" != "$OLD" ]; then
            echo "检测到 LEDE 更新"
            echo "$NEW" > "$STATE"
            echo "lede_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "LEDE 没有更新"
          fi

          echo ""
          echo "============================================================"
          echo "源码检测完成"
          echo "============================================================"

      # ============================================================
      # 保存 Commit 状态
      # ============================================================

      - name: 保存源码 Commit 状态
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/source-state; then
            echo "源码状态没有变化，无需提交"
            exit 0
          fi

          git add .github/source-state

          git commit -m "chore: update source commit state"

          git push

      # ============================================================
      # OpenWrt main 更新
      # ============================================================

      - name: 触发 OpenWrt main 编译
        if: steps.check.outputs.openwrt_main_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "openwrt-main.yml",
              ref: "main"
            });

      - name: 触发 OpenWrt 测试编译
        if: steps.check.outputs.openwrt_main_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "openwrt-test-openwrt.yml",
              ref: "main"
            });

      - name: 触发 OpenWrt Rockchip 编译
        if: steps.check.outputs.openwrt_main_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "Openwrt_rockchip.yml",
              ref: "main"
            });

      # ============================================================
      # iStoreOS 24.10 更新
      # ============================================================

      - name: 触发 iStoreOS 24.10 编译
        if: steps.check.outputs.istore_24_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "openwrt-istore-24.10.yml",
              ref: "main"
            });

      - name: 触发 iStoreOS ALL 24.10 编译
        if: steps.check.outputs.istore_24_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "openwrt-test-istoreALL-24.10.yml",
              ref: "main"
            });

      # ============================================================
      # iStoreOS 25.12 更新
      # ============================================================

      - name: 触发 iStoreOS 25.12 编译
        if: steps.check.outputs.istore_25_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "Openwrt_istore-25.12.yml",
              ref: "main"
            });

      - name: 触发 iStoreOS ALL 25.12 编译
        if: steps.check.outputs.istore_25_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "Openwrt_test-istoreALL-25.12.yaml",
              ref: "main"
            });

      # ============================================================
      # LEDE 更新
      # ============================================================

      - name: 触发 LEDE Rockchip 编译
        if: steps.check.outputs.lede_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "LEDE-rockchip.yml",
              ref: "main"
            });
